<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>DirectR2 上报测试台</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1a202c;
    --muted: #718096;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --green: #16a34a;
    --orange: #d97706;
    --red: #dc2626;
    --code-bg: #0f172a;
    --code-text: #e2e8f0;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  header {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  header h1 { margin: 0 0 12px; font-size: 20px; }
  .url-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .url-bar label { font-weight: 600; white-space: nowrap; }
  .url-bar input[type="text"] {
    flex: 1; min-width: 320px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .hint { color: var(--muted); font-size: 12px; }

  section.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  section.card > h2 {
    margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; gap: 8px;
  }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: #eef2ff; color: var(--primary); font-weight: 500;
  }

  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    padding: 7px 14px; border: 1px solid var(--border); background: #fff;
    border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text);
    transition: all .12s;
  }
  button:hover { border-color: var(--primary); color: var(--primary); }
  button:active { transform: translateY(1px); }
  button.primary {
    background: var(--primary); color: #fff; border-color: var(--primary);
    font-weight: 600; padding: 10px 24px;
  }
  button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
  button.danger:hover { border-color: var(--red); color: var(--red); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 960px) { .two-col { grid-template-columns: 1fr; } }

  .form-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px;
  }
  .form-grid label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .form-grid label.full { grid-column: 1 / -1; }
  .form-grid label .req { color: var(--red); }
  .form-grid input, .form-grid textarea {
    padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; color: var(--text); font-family: inherit;
  }
  .form-grid input:focus, .form-grid textarea:focus {
    outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12);
  }
  .form-grid textarea { resize: vertical; min-height: 64px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }

  .actions { margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  #payloadEditor {
    width: 100%; min-height: 360px; padding: 12px;
    border: 1px solid var(--border); border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    line-height: 1.5; resize: vertical; background: #0f172a; color: #e2e8f0;
  }
  #payloadEditor:focus { outline: none; border-color: var(--primary); }

  .send-bar { display: flex; gap: 12px; align-items: center; }
  .send-bar .status { font-size: 12px; color: var(--muted); }

  #resultMeta { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
  #resultMeta .stat { background: #f1f5f9; padding: 6px 12px; border-radius: 6px; }
  #resultMeta .stat b { font-family: ui-monospace, Menlo, monospace; }
  .status-code { font-family: ui-monospace, Menlo, monospace; font-weight: 700; padding: 4px 10px; border-radius: 6px; color: #fff; }
  .status-2xx { background: var(--green); }
  .status-3xx { background: #0891b2; }
  .status-4xx { background: var(--orange); }
  .status-5xx { background: var(--red); }
  .status-err { background: #475569; }

  #resultBody {
    background: var(--code-bg); color: var(--code-text); padding: 14px;
    border-radius: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    line-height: 1.5; overflow: auto; max-height: 420px; white-space: pre-wrap;
    word-break: break-all; margin: 0;
  }
  .empty-result { color: var(--muted); font-style: italic; padding: 14px; }

  .errors-box { margin-bottom: 10px; }
  .errors-box ul { margin: 6px 0 0; padding-left: 20px; color: var(--red); font-size: 12px; }

  .edge-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .edge-grid button { background: #fff7ed; border-color: #fed7aa; color: #9a3412; }
  .edge-grid button:hover { border-color: var(--orange); color: var(--orange); background: #ffedd5; }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 16px 0; }
</style>
</head>
<body>

<header>
  <h1>🛰️ DirectR2 上报测试台</h1>
  <div class="url-bar">
    <label for="reportUrl">上报 URL</label>
    <input type="text" id="reportUrl" spellcheck="false" />
    <button id="saveUrlBtn">💾 保存</button>
    <span class="hint">方法 POST · Content-Type: application/json · 无 token 鉴权（仅 CORS）</span>
  </div>
</header>

<section class="card">
  <h2>① 模板 <span class="hint">— 一键填充 JSON 负载</span></h2>
  <div class="btn-row">
    <button data-template="page_view">📄 PV 浏览 (view)</button>
    <button data-template="click">🖱️ 点击 (click)</button>
    <button data-template="error">💥 JS 错误 (fail)</button>
    <button data-template="api">🌐 API 请求 (success)</button>
    <button data-template="perf">⏱️ 性能 (process)</button>
    <button data-template="custom">⚙️ 自定义</button>
    <button data-template="batch10">📦 批量 ×10（双 app_id）</button>
  </div>
</section>

<div class="two-col">
  <section class="card">
    <h2>② 表单构造器 <span class="hint">— 填好后点「添加到 logs」</span></h2>
    <div class="form-grid">
      <label>event_type <span class="req">*</span>
        <input id="f_event_type" list="eventTypeList" value="view" />
        <datalist id="eventTypeList">
          <option value="view"></option><option value="click"></option>
          <option value="success"></option><option value="fail"></option>
          <option value="process"></option><option value="change"></option>
        </datalist>
      </label>
      <label>event_id
        <input id="f_event_id" value="page_view" />
      </label>
      <label>user_id <input id="f_user_id" value="user_test_001" /></label>
      <label>session_id <input id="f_session_id" /></label>
      <label>app_id <input id="f_app_id" value="snapmaker-model-community" /></label>
      <label>sdk_version <input id="f_sdk_version" value="1.0.0" /></label>
      <label>client_type <input id="f_client_type" value="Web" /></label>
      <label>fingerprint_id <input id="f_fingerprint_id" value="fp_test_0001" /></label>
      <label>page_url <input id="f_page_url" /></label>
      <label>page_title <input id="f_page_title" /></label>
      <label>referrer <input id="f_referrer" /></label>
      <label>timestamp（留空=当前）<input id="f_timestamp" placeholder="Date.now()" /></label>
      <label class="full">extra（JSON 对象）
        <textarea id="f_extra">{}</textarea>
      </label>
    </div>
    <div class="actions">
      <button class="primary" id="addBtn">＋ 添加到 logs</button>
      <button id="resetFormBtn">清空表单</button>
      <span class="hint" id="formStatus"></span>
    </div>
  </section>

  <section class="card">
    <h2>③ JSON 负载 <span class="badge">唯一真相源</span></h2>
    <textarea id="payloadEditor" spellcheck="false"></textarea>
    <div class="actions">
      <button id="formatBtn">美化</button>
      <button id="validateBtn">校验</button>
      <button id="clearBtn" class="danger">清空</button>
      <span class="hint" id="jsonStatus"></span>
    </div>
  </section>
</div>

<section class="card">
  <h2>④ 发送</h2>
  <div class="send-bar">
    <button class="primary" id="sendBtn">🚀 发送上报</button>
    <span class="status" id="sendStatus"></span>
  </div>
</section>

<section class="card">
  <h2>⑤ 响应结果</h2>
  <div id="resultMeta"><span class="empty-result">尚未发送</span></div>
  <div id="errorsBox"></div>
  <pre id="resultBody"><span class="empty-result">发送后此处显示完整响应</span></pre>
</section>

<section class="card">
  <h2>⑥ 边界 / 错误用例 <span class="hint">— 预期返回 4xx / 5xx，用于验证 Worker 校验逻辑</span></h2>
  <div class="edge-grid">
    <button data-edge="missing_event_type">缺 event_type → 400</button>
    <button data-edge="long_page_url">page_url 超长(4097) → 400</button>
    <button data-edge="empty_logs">空 logs 数组 → 400</button>
    <button data-edge="non_object_log">logs 含非对象 → 400</button>
    <button data-edge="bad_content_type">错误 Content-Type → 415</button>
    <button data-edge="non_json_body">非 JSON body → 400</button>
  </div>
</section>

<footer>
  DirectR2 上报测试台 · 单文件零依赖 · 用于联调
  <code>/api/v1/report</code> 端点
</footer>

<script>
'use strict';

// ============================================================================
// 常量
// ============================================================================
const DEFAULT_URL = 'https://direnctr2.snapmaker-app.workers.dev/api/v1/report';
const LS_URL_KEY = 'directr2_testharness_url';

// 真实的 SDK 字段值（取自 src/core/reporter.js、config.js、README）
const APP_ID = 'snapmaker-model-community';
const APP_ID_2 = 'snapmaker-printer-frontend';
const SDK_VERSION = '1.0.0';

// ============================================================================
// DOM
// ============================================================================
const $ = (id) => document.getElementById(id);
const urlInput = $('reportUrl');
const editor = $('payloadEditor');

// ============================================================================
// 状态：payload 是唯一真相源；编辑器显示它，所有操作都更新它
// ============================================================================
let payload = { logs: [] };

// ============================================================================
// 初始化（init() 在脚本末尾调用 —— 确保 TEMPLATES / EDGE_CASES 等 const 已初始化，避免 TDZ）
// ============================================================================
function init() {
  // URL：localStorage 优先，否则默认
  urlInput.value = localStorage.getItem(LS_URL_KEY) || DEFAULT_URL;

  fillFormDefaults();
  applyTemplate('page_view'); // 启动即有一条示例数据
  bindEvents();
}

function bindEvents() {
  // URL 保存
  $('saveUrlBtn').addEventListener('click', () => {
    localStorage.setItem(LS_URL_KEY, urlInput.value.trim());
    flash($('saveUrlBtn'), '已保存');
  });

  // 模板按钮
  document.querySelectorAll('[data-template]').forEach((btn) => {
    btn.addEventListener('click', () => applyTemplate(btn.dataset.template));
  });

  // 表单
  $('addBtn').addEventListener('click', addFormEventToLogs);
  $('resetFormBtn').addEventListener('click', resetForm);

  // JSON 编辑器
  $('formatBtn').addEventListener('click', () => syncAndRender(true));
  $('validateBtn').addEventListener('click', validateEditor);
  $('clearBtn').addEventListener('click', () => {
    payload = { logs: [] };
    renderEditor();
    setJsonStatus('已清空', 'muted');
  });

  // 发送
  $('sendBtn').addEventListener('click', sendFromEditor);

  // 边界用例
  document.querySelectorAll('[data-edge]').forEach((btn) => {
    btn.addEventListener('click', () => runEdgeCase(btn.dataset.edge));
  });
}

// ============================================================================
// 表单默认值
// ============================================================================
function fillFormDefaults() {
  $('f_session_id').value = 'sess_' + randHex(8);
  $('f_page_url').value = location.href;
  $('f_page_title').value = document.title || 'DirectR2 测试页';
  $('f_referrer').value = document.referrer || 'https://models.snapmaker.com/';
}

function resetForm() {
  ['f_event_type', 'f_event_id', 'f_user_id', 'f_sdk_version',
   'f_client_type', 'f_app_id', 'f_fingerprint_id', 'f_page_url',
   'f_page_title', 'f_referrer', 'f_timestamp'].forEach((id) => ($(id).value = ''));
  $('f_event_type').value = 'view';
  $('f_event_id').value = 'page_view';
  $('f_user_id').value = 'user_test_001';
  $('f_app_id').value = APP_ID;
  $('f_sdk_version').value = SDK_VERSION;
  $('f_client_type').value = 'Web';
  $('f_fingerprint_id').value = 'fp_test_0001';
  $('f_session_id').value = 'sess_' + randHex(8);
  $('f_page_url').value = location.href;
  $('f_extra').value = '{}';
}

// ============================================================================
// 表单 → 事件对象 → 追加到 payload.logs
// ============================================================================
function readForm() {
  const extraRaw = $('f_extra').value.trim();
  let extra = {};
  if (extraRaw && extraRaw !== '{}') {
    try {
      extra = JSON.parse(extraRaw);
      if (typeof extra !== 'object' || Array.isArray(extra) || extra === null) {
        throw new Error('extra 必须是 JSON 对象');
      }
    } catch (e) {
      throw new Error('extra 不是合法 JSON：' + e.message);
    }
  }
  const ts = $('f_timestamp').value.trim();
  const event = {
    event_type: $('f_event_type').value.trim(),
    event_id: $('f_event_id').value.trim(),
    user_id: $('f_user_id').value.trim(),
    session_id: $('f_session_id').value.trim(),
    app_id: $('f_app_id').value.trim(),
    sdk_version: $('f_sdk_version').value.trim(),
    client_type: $('f_client_type').value.trim() || 'Web',
    fingerprint_id: $('f_fingerprint_id').value.trim(),
    page_url: $('f_page_url').value.trim(),
    page_title: $('f_page_title').value.trim(),
    referrer: $('f_referrer').value.trim(),
    timestamp: ts ? Number(ts) : Date.now(),
    extra,
  };
  if (!event.event_type) throw new Error('event_type 必填');
  return event;
}

function addFormEventToLogs() {
  try {
    const event = readForm();
    syncFromEditor(); // 先把编辑器手改并入，避免丢失
    payload.logs.push(event);
    renderEditor();
    flash($('formStatus'), `✓ 已添加（共 ${payload.logs.length} 条）`, 'green');
  } catch (e) {
    flash($('formStatus'), '✗ ' + e.message, 'red');
  }
}

// ============================================================================
// 模板（真实可信的 SDK 数据）
// ============================================================================
function baseEvent(overrides = {}) {
  return Object.assign({
    event_type: 'view',
    event_id: 'page_view',
    user_id: 'user_test_001',
    session_id: 'sess_' + randHex(8),
    app_id: APP_ID,
    sdk_version: SDK_VERSION,
    client_type: 'Web',
    fingerprint_id: 'fp_test_0001',
    page_url: 'https://models.snapmaker.com/',
    page_title: 'Snapmaker 模型社区',
    referrer: 'https://www.snapmaker.com/',
    timestamp: Date.now(),
    extra: {},
  }, overrides);
}

const TEMPLATES = {
  page_view: () => ({ logs: [baseEvent({
    event_type: 'view', event_id: 'page_view',
    extra: { is_new_user: true, utm: { utm_source: 'google', utm_medium: 'cpc' } },
  })] }),

  click: () => ({ logs: [baseEvent({
    event_type: 'click', event_id: 'element_click',
    page_url: 'https://models.snapmaker.com/model/123',
    extra: { element: 'button#download-cta', text: '立即下载', xpath: '/html/body/div[2]/button' },
  })] }),

  error: () => ({ logs: [baseEvent({
    event_type: 'fail', event_id: 'js_error',
    extra: {
      message: "TypeError: Cannot read properties of undefined (reading 'id')",
      filename: 'https://models.snapmaker.com/assets/app.8f3a.js',
      lineno: 42, colno: 17,
      stack: 'TypeError: Cannot read properties of undefined...\n    at renderModel (app.js:42:17)',
    },
  })] }),

  api: () => ({ logs: [baseEvent({
    event_type: 'success', event_id: 'api_request',
    extra: { url: '/api/v1/models/123', method: 'GET', status: 200, duration: 187 },
  })] }),

  perf: () => ({ logs: [baseEvent({
    event_type: 'process', event_id: 'perf_lcp',
    extra: { metricName: 'LCP', value: 2340, rating: 'good', navType: 'navigate' },
  })] }),

  custom: () => ({ logs: [baseEvent({
    event_type: 'process', event_id: 'custom_event',
    extra: { action: 'export_model', format: 'stl' },
  })] }),

  batch10: () => {
    // 双 app_id，测试 Worker 的 groupByAppId 分组写多文件
    const sid = 'sess_' + randHex(8);
    const logs = [];
    const pages = ['/', '/model/123', '/model/456', '/category/toys', '/about'];
    for (let i = 0; i < 5; i++) {
      logs.push(baseEvent({
        app_id: APP_ID, session_id: sid,
        event_type: 'view', event_id: 'page_view',
        page_url: 'https://models.snapmaker.com' + pages[i % pages.length],
        timestamp: Date.now() + i * 1000,
      }));
    }
    for (let i = 0; i < 5; i++) {
      logs.push(baseEvent({
        app_id: APP_ID_2, session_id: 'sess_' + randHex(8),
        event_type: 'click', event_id: 'element_click',
        page_url: 'https://printer.snapmaker.com/print',
        timestamp: Date.now() + (5 + i) * 1000,
      }));
    }
    return { logs };
  },
};

function applyTemplate(name) {
  const fn = TEMPLATES[name];
  if (!fn) return;
  payload = fn();
  renderEditor();
  setJsonStatus(`已加载模板「${name}」（${payload.logs.length} 条）`, 'green');
}

// ============================================================================
// JSON 编辑器：同步与渲染
// ============================================================================
function renderEditor() {
  editor.value = JSON.stringify(payload, null, 2);
}

function syncFromEditor(silent = false) {
  try {
    const parsed = JSON.parse(editor.value);
    if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
      throw new Error('顶层必须是对象 { logs: [...] }');
    }
    payload = parsed;
    if (!silent) setJsonStatus('✓ 已同步', 'green');
    return true;
  } catch (e) {
    if (!silent) setJsonStatus('✗ ' + e.message, 'red');
    return false;
  }
}

function syncAndRender() {
  if (syncFromEditor()) renderEditor();
}

function validateEditor() {
  syncFromEditor();
}

function setJsonStatus(msg, kind) {
  const el = $('jsonStatus');
  el.textContent = msg;
  el.style.color = kind === 'green' ? 'var(--green)' :
                   kind === 'red' ? 'var(--red)' : 'var(--muted)';
}

// ============================================================================
// 边界 / 错误用例 —— 构造非法请求，验证 Worker 的校验与错误码
// ============================================================================
const EDGE_CASES = {
  // 顶层 logs[].event_type 缺失 → 预期 400 "event_type is required"
  missing_event_type: () => ({
    body: JSON.stringify({ logs: [{ event_id: 'no_type', user_id: 'u1', app_id: APP_ID }] }),
    contentType: 'application/json',
    expect: '400 event_type is required',
  }),
  // page_url 超 4096 字符 → 预期 400 "page_url exceeds 4096 characters"
  long_page_url: () => ({
    body: JSON.stringify({ logs: [baseEvent({ event_type: 'view', page_url: 'https://x.com/' + 'a'.repeat(4097) })] }),
    contentType: 'application/json',
    expect: '400 page_url exceeds 4096 characters',
  }),
  // 空 logs 数组 → 预期 400 "logs array must not be empty"
  empty_logs: () => ({
    body: JSON.stringify({ logs: [] }),
    contentType: 'application/json',
    expect: '400 logs array must not be empty',
  }),
  // logs 元素非对象 → 预期 400 "event must be an object"
  non_object_log: () => ({
    body: JSON.stringify({ logs: ['not-an-object', 42] }),
    contentType: 'application/json',
    expect: '400 event must be an object',
  }),
  // 合法 body 但 Content-Type 非 application/json → 预期 415
  bad_content_type: () => ({
    body: JSON.stringify({ logs: [baseEvent()] }),
    contentType: 'text/plain',
    expect: '415 Content-Type must be application/json',
  }),
  // 非 JSON 文本，但 Content-Type=application/json → 预期 400 "Invalid JSON body"
  non_json_body: () => ({
    body: 'this is { not valid json',
    contentType: 'application/json',
    expect: '400 Invalid JSON body',
  }),
};

function runEdgeCase(name) {
  const c = EDGE_CASES[name];
  if (!c) return;
  const { body, contentType, expect } = c();
  $('sendStatus').textContent = `边界用例「${name}」预期：${expect}`;
  sendRequest(body, contentType);
}

// ============================================================================
// 发送
// ============================================================================
async function sendFromEditor() {
  // 以编辑器文本为准（用户手改后直接发送）
  let body;
  try {
    const parsed = JSON.parse(editor.value);
    body = JSON.stringify(parsed);
  } catch (e) {
    setJsonStatus('✗ JSON 不合法，无法发送：' + e.message, 'red');
    return;
  }
  $('sendStatus').textContent = '发送中...';
  await sendRequest(body, 'application/json');
}

async function sendRequest(body, contentType) {
  const url = urlInput.value.trim();
  const btn = $('sendBtn');
  if (!url) { flash($('sendStatus'), '✗ 请填写上报 URL', 'red'); return; }

  btn.disabled = true;
  const t0 = performance.now();
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': contentType },
      body,
    });
    const elapsed = Math.round(performance.now() - t0);
    const text = await res.text();
    let json = null;
    try { json = JSON.parse(text); } catch (_) { /* 非 JSON 响应 */ }
    renderResult(res.status, elapsed, json, text);
    $('sendStatus').textContent = `完成 · ${elapsed}ms`;
  } catch (e) {
    const elapsed = Math.round(performance.now() - t0);
    renderResult(0, elapsed, null, '网络/CORS 错误：' + e.message +
      '\n\n可能原因：\n· 从 file:// 打开时部分浏览器限制跨域 fetch，改用本地静态服务器（npx serve）打开\n· URL 错误或 Worker 未部署\n· 浏览器离线');
    $('sendStatus').textContent = '发送失败';
  } finally {
    btn.disabled = false;
  }
}

// ============================================================================
// 结果渲染
// ============================================================================
function renderResult(status, elapsed, json, rawText) {
  const metaEl = $('resultMeta');
  const bodyEl = $('resultBody');
  const errorsEl = $('errorsBox');

  // 状态码着色
  const cls = status === 0 ? 'status-err' :
              status < 300 ? 'status-2xx' :
              status < 400 ? 'status-3xx' :
              status < 500 ? 'status-4xx' : 'status-5xx';
  const codeLabel = status === 0 ? 'ERR' : status;

  // accepted / rejected
  let statsHtml = '';
  if (json && json.data) {
    const d = json.data;
    statsHtml = `<span class="stat">accepted: <b style="color:var(--green)">${d.accepted ?? '-'}</b></span>` +
                `<span class="stat">rejected: <b style="color:var(--red)">${d.rejected ?? '-'}</b></span>`;
  }

  metaEl.innerHTML =
    `<span class="status-code ${cls}">${codeLabel}</span>` +
    `<span class="stat">耗时: <b>${elapsed}ms</b></span>` +
    `<span class="stat">message: <b>${escapeHtml(json?.message ?? '-')}</b></span>` +
    statsHtml;

  // validationErrors 单独高亮
  errorsEl.innerHTML = '';
  const errs = json?.data?.validationErrors || json?.errors;
  if (Array.isArray(errs) && errs.length) {
    const items = errs.map((e) => `<li>${escapeHtml(typeof e === 'string' ? e : JSON.stringify(e))}</li>`).join('');
    errorsEl.innerHTML = `<div class="errors-box"><b style="color:var(--red)">校验错误（前 ${errs.length} 条）：</b><ul>${items}</ul></div>`;
  }

  // 响应体
  if (json) {
    bodyEl.textContent = JSON.stringify(json, null, 2);
  } else {
    bodyEl.textContent = rawText;
  }
}

// ============================================================================
// 工具
// ============================================================================
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function randHex(n) {
  const chars = '0123456789abcdef';
  let s = '';
  for (let i = 0; i < n; i++) s += chars[Math.floor(Math.random() * 16)];
  return s;
}

function flash(el, msg, color) {
  // el 可能是 button 或 span
  if (el.tagName === 'BUTTON') {
    const orig = el.textContent;
    el.textContent = msg;
    setTimeout(() => { el.textContent = orig; }, 1200);
  } else {
    el.textContent = msg;
    el.style.color = color === 'green' ? 'var(--green)' :
                     color === 'red' ? 'var(--red)' : 'var(--muted)';
  }
}

// 启动：置于末尾，确保所有 const 模板（TEMPLATES / EDGE_CASES）已完成初始化
init();
</script>
